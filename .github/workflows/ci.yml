name: CI

# Tetikleyiciler: main'e push ve her pull request (docs: events-that-trigger-workflows)
on:
  push:
    branches: [main]
  pull_request:

# Aynı dala gelen yeni push, eski koşuyu iptal eder (docs: control-the-concurrency-of-workflows-and-jobs)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# En az yetki: yalnızca okuma (docs: secure-use)
permissions:
  contents: read

jobs:
  verify:
    name: Kaynak doğrulama
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # new Function yalnızca derler, çalıştırmaz — DOM stub gerektirmez
      - name: index.html inline script sözdizimi
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const m=h.match(/<script>([\s\S]*?)<\/script>/);if(!m){console.error('inline script bulunamadi');process.exit(1)}new Function(m[1]);console.log('index.html script OK')"

      - name: Vercel vekili (api/mailtm.js) sözdizimi
        run: node --check deploy/api/mailtm.js

      # php, ubuntu-latest (ubuntu-24.04) imajında önceden kurulu gelir
      - name: proxy.php sözdizimi
        run: php -l proxy.php

  docker:
    name: Multi-stage imajı derle
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Dockerfile'ın build+test aşamaları bu derlemenin içinde çalışır; .dockerignore context'i
      # yalnızca index.html/proxy.php/deploy ile sınırlar. Push kapalı — registry için aşağıya bak.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: wuaze-tools:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
